name: Release All Platforms

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # -------------------------------------------------------------
  # 1. Desktop Packages (Windows, macOS, Ubuntu x86/ARM64)
  # -------------------------------------------------------------
  desktop:
    name: Package ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GH_REPO: junrobo/synapshare-releases
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-14
            command: bash scripts/package_macos.sh
            artifact: dist/packages/*
          - name: Ubuntu
            os: ubuntu-24.04
            command: bash scripts/package_flatpak.sh
            artifact: dist/packages/*
          - name: Ubuntu-arm64
            os: ubuntu-24.04-arm
            command: bash scripts/package_flatpak.sh
            artifact: dist/packages/*
          - name: Windows
            os: windows-2022
            command: powershell -ExecutionPolicy Bypass -File scripts/package_windows.ps1
            artifact: dist/packages/*

    steps:
      - name: Checkout private source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: junrobo/synapshare
          ssh-key: ${{ secrets.SYNAPSHARE_DEPLOY_KEY }}
          submodules: true
          ref: develop

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"

      - name: Install Ubuntu system dependencies
        if: startsWith(matrix.name, 'Ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests
        env:
          PYTHONPATH: src
          QT_QPA_PLATFORM: offscreen

      - name: Build package
        run: ${{ matrix.command }}

      - name: Upload to GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME:-continuous}"
          if [ "${GITHUB_REF_TYPE:-}" != "tag" ]; then
            tag="continuous"
            gh release view "$tag" --repo junrobo/synapshare-releases >/dev/null 2>&1 || \
              gh release create "$tag" --repo junrobo/synapshare-releases --prerelease --title "Continuous build" \
                --notes "Rolling packages from latest develop." || true
          else
            gh release view "$tag" --repo junrobo/synapshare-releases >/dev/null 2>&1 || \
              gh release create "$tag" --repo junrobo/synapshare-releases --title "SynapShare $tag" --notes "Release $tag" || true
          fi
          gh release upload "$tag" dist/packages/* --repo junrobo/synapshare-releases --clobber

      - name: Upload Artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: synapshare-${{ matrix.name }}
          path: ${{ matrix.artifact }}
          retention-days: 7

  # -------------------------------------------------------------
  # 2. Android APK Build
  # -------------------------------------------------------------
  android:
    name: Package Android
    runs-on: ubuntu-24.04
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GH_REPO: junrobo/synapshare-releases
    steps:
      - name: Checkout private source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: junrobo/synapshare
          ssh-key: ${{ secrets.SYNAPSHARE_DEPLOY_KEY }}
          ref: develop

      - name: Set up JDK 17
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build APKs
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease

      - name: Upload APKs to GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME:-continuous}"
          if [ "${GITHUB_REF_TYPE:-}" != "tag" ]; then
            tag="continuous"
            gh release view "$tag" --repo junrobo/synapshare-releases >/dev/null 2>&1 || \
              gh release create "$tag" --repo junrobo/synapshare-releases --prerelease --title "Continuous build" \
                --notes "Rolling packages from latest develop." || true
          else
            gh release view "$tag" --repo junrobo/synapshare-releases >/dev/null 2>&1 || \
              gh release create "$tag" --repo junrobo/synapshare-releases --title "SynapShare $tag" --notes "Release $tag" || true
          fi
          gh release upload "$tag" android/app/build/outputs/apk/**/*.apk --repo junrobo/synapshare-releases --clobber

      - name: Upload Artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: synapshare-Android
          path: android/app/build/outputs/apk/**/*.apk
          retention-days: 7
